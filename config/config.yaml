# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件 (餐饮创投定制版 + Kimi 大脑)
#                      Version: 2.2.0
# ═══════════════════════════════════════════════════════════════
# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true        

# ===============================================================
# 1.5 调度系统 
# ===============================================================
schedule:
  enabled: true           
  preset: "morning_evening"

# ===============================================================
# 2. 数据源 - 热榜平台 (已精简，去除了贴吧、B站等娱乐噪音)
# ===============================================================
platforms:
  enabled: true                         
  sources:
    - id: "toutiao"
      name: "今日头条"
    - id: "baidu"
      name: "百度热搜"
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
    - id: "cls-hot"
      name: "财联社热门"
    - id: "zhihu"
      name: "知乎"
    - id: "weibo"
      name: "微博"

# ===============================================================
# 3. 数据源 - RSS 订阅 (国内顶级商业/创投媒体源)
# ===============================================================
rss:
  enabled: true                       
  freshness_filter:
    enabled: true                     
    max_age_days: 1                   
  feeds:
    - id: "36kr"
      name: "36氪-创投频道"
      url: "https://36kr.com/feed"
    - id: "pedaily"
      name: "投资界-VC/PE"
      url: "https://rsshub.rssforever.com/pedaily/2012"
    - id: "huxiu"
      name: "虎嗅-商业资讯"
      url: "https://rsshub.rssforever.com/huxiu/article"
    - id: "tmtpost"
      name: "钛媒体-商业"
      url: "https://rsshub.rssforever.com/tmtpost/default"

# ===============================================================
# 4. 报告模式
# ===============================================================
report:
  mode: "current"                     
  display_mode: "keyword"             
  sort_by_position_first: false
  rank_threshold: 5                   
  max_news_per_keyword: 0             

# ===============================================================
# 4.5 筛选策略
# ===============================================================
filter:
  method: "ai"                     
  priority_sort_enabled: true

# ===============================================================
# 4.6 AI 智能筛选配置
# ===============================================================
ai_filter:
  batch_size: 200                         
  batch_interval: 2                       
  min_score: 0.7                          
  reclassify_threshold: 0.6
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

# ===============================================================
# 5. 推送内容控制
# ===============================================================
display:
  region_order:
    - new_items                           
    - hotlist                          
    - rss                                 
    - standalone                          
    - ai_analysis             
  regions:
    hotlist: true                     
    new_items: false                   
    rss: true                         
    standalone: false                 
    ai_analysis: true                 
  standalone:
    platforms: ["wallstreetcn-hot"]     
    rss_feeds: []                     
    max_items: 20                     

# ===============================================================
# 6. 推送通知
# ===============================================================
notification:
  enabled: true                       
  channels:
    feishu:
      webhook_url: ""                 
    dingtalk:
      webhook_url: ""                 
    wework:
      webhook_url: ""                 
      msg_type: "markdown"            
    telegram:
      bot_token: ""                   
      chat_id: ""                     
    email:
      from: ""                        
      password: ""                    
      to: ""                          
      smtp_server: ""                 
      smtp_port: ""                   
    ntfy:
      server_url: "https://ntfy.sh"   
      topic: ""                       
      token: ""                       
    bark:
      url: ""                         
    slack:
      webhook_url: ""                 
    generic_webhook:
      webhook_url: ""                 
      payload_template: ""            

# ===============================================================
# 7. 存储配置
# ===============================================================
storage:
  backend: "auto"
  formats:
    sqlite: true                      
    txt: false                        
    html: true                       
  local:
    data_dir: "output"                
    retention_days: 0                 
  remote:
    retention_days: 0                 
    endpoint_url: ""                  
    bucket_name: ""                   
    access_key_id: ""                 
    secret_access_key: ""             
    region: ""                        
  pull:
    enabled: false                    
    days: 7                           

# ===============================================================
# 8. AI 模型配置 (已彻底替换为 Kimi 月之暗面)
# ===============================================================
ai:
  # 强制使用 openai 协议格式调用 Kimi 模型
  model: "openai/moonshot-v1-8k"
  api_key: ""                       
  # 指向 Kimi 的官方接口地址
  api_base: "https://api.moonshot.cn/v1"                     
  timeout: 120                      
  # 稍微调低温度，让商业分析更严谨客观
  temperature: 0.6                  
  max_tokens: 5000                  
  num_retries: 1                    
  fallback_models: []               

# ===============================================================
# 9. AI 分析功能
# ===============================================================
ai_analysis:
  enabled: true                      
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 150        
  include_rss: true                 
  include_standalone: true          
  include_rank_timeline: true       

# ===============================================================
# 10. AI 翻译功能
# ===============================================================
ai_translation:
  enabled: true                    
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  scope:
    hotlist: false                  
    rss: true                      
    standalone: true               

# ===============================================================
# 11. 高级设置
# ===============================================================
advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"
  crawler:
    request_interval: 2000            
    use_proxy: false                  
    default_proxy: "http://127.0.0.1:10801"
  rss:
    request_interval: 1000            
    timeout: 15                       
    use_proxy: false                  
    proxy_url: ""                     
  weight:
    rank: 0.6                         
    frequency: 0.3                    
    hotness: 0.1                      
  max_accounts_per_channel: 3         
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3              
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
